apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-server
  template:
    metadata:
      labels:
        app: inventory-server
    spec:
      containers:
      - name: inventory-server
        image: amineouhiba/inventory-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-configmap
              key: PORT
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: app-configmap
              key: MONGO_URI
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-configmap
              key: NODE_ENV
